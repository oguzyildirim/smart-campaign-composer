# Local stack for Smart Campaign Composer. Start with: docker compose up
# Requires a .env file copied from .env.example.
#
# Host ports bind to 127.0.0.1 only. Postgres and Kafka are reachable only
# on the internal Compose network.

name: smart-campaign-composer

x-go-service: &go-service
  restart: unless-stopped
  stop_grace_period: 20s # above SHUTDOWN_TIMEOUT so graceful shutdown can finish
  read_only: true
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    environment:
      # Single-node KRaft: this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by the application in later milestones.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.20.1
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: loads deterministic fake users after migrations. Skips when
  # the database already holds users, so restarts never duplicate data.
  seed:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/seed
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SEED_USER_COUNT: ${SEED_USER_COUNT:-5000}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20261022}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./cmd/api
    environment:
      <<: *app-env
      API_HTTP_ADDR: :8080
      # Optional: empty means the deterministic mock LLM (later milestones).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Previews are only meaningful once the seed has committed.
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./cmd/worker
    environment:
      <<: *app-env
      WORKER_HEALTH_ADDR: :8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mock-provider:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./mock-provider
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_PROVIDER_ADDR: :9090
    ports:
      - "127.0.0.1:${MOCK_PROVIDER_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  kafka-data:
