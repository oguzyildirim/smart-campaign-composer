# Local stack for Smart Campaign Composer. Start with: docker compose up
# Requires a .env file copied from .env.example.
#
# Host ports bind to 127.0.0.1 only. Postgres and Kafka are reachable only
# on the internal Compose network.

name: smart-campaign-composer

x-go-service: &go-service
  restart: unless-stopped
  stop_grace_period: 20s # above SHUTDOWN_TIMEOUT so graceful shutdown can finish
  read_only: true
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
  # Stored on each delivery at approval (api) and enforced by workers.
  DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-5}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    environment:
      # Single-node KRaft: this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The worker creates deliveries.sms and deliveries.email at startup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.20.1
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: loads deterministic fake users after migrations. Skips when
  # the database already holds users, so restarts never duplicate data.
  seed:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/seed
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SEED_USER_COUNT: ${SEED_USER_COUNT:-5000}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20261022}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./cmd/api
    environment:
      <<: *app-env
      API_HTTP_ADDR: :8080
      # Optional: empty means the deterministic mock LLM.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # Empty: claude when a key is set, otherwise mock.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_SEGMENT_TIMEOUT: ${LLM_SEGMENT_TIMEOUT:-20s}
      LLM_DRAFTS_TIMEOUT: ${LLM_DRAFTS_TIMEOUT:-60s}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
      LLM_SDK_MAX_RETRIES: ${LLM_SDK_MAX_RETRIES:-2}
      LLM_MOCK_STREAM_DELAY: ${LLM_MOCK_STREAM_DELAY:-40ms}
      # Live dashboard: one shared poll per campaign and interval.
      PROGRESS_POLL_INTERVAL: ${PROGRESS_POLL_INTERVAL:-1s}
      PROGRESS_MAX_VIEWERS: ${PROGRESS_MAX_VIEWERS:-20}
      PROGRESS_THROUGHPUT_WINDOW: ${PROGRESS_THROUGHPUT_WINDOW:-10s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Previews are only meaningful once the seed has committed.
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Safe to scale: docker compose up -d --scale worker=3. Workers share
  # one consumer group, claim deliveries exclusively in Postgres, and share
  # each channel's rate limit through Postgres.
  worker:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./cmd/worker
    environment:
      <<: *app-env
      WORKER_HEALTH_ADDR: :8081
      PROVIDER_URL: http://mock-provider:9090
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-5s}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-1s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-60s}
      RETRY_BACKOFF_FACTOR: ${RETRY_BACKOFF_FACTOR:-2}
      DELIVERY_LEASE: ${DELIVERY_LEASE:-60s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-90}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-5}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
    # /healthz, /readyz and /metrics on an ephemeral host port per replica
    # (scaling-safe); find it with: docker compose port --index 1 worker 8081
    ports:
      - "127.0.0.1::8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mock-provider:
    <<: *go-service
    build:
      context: .
      args:
        CMD_PATH: ./mock-provider
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_PROVIDER_ADDR: :9090
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MOCK_SEED: ${MOCK_SEED:-0}
      MOCK_LATENCY_MIN: ${MOCK_LATENCY_MIN:-10ms}
      MOCK_LATENCY_MAX: ${MOCK_LATENCY_MAX:-80ms}
      MOCK_RATE_LIMIT_RATE: ${MOCK_RATE_LIMIT_RATE:-0.06}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-1s}
      MOCK_SERVER_ERROR_RATE: ${MOCK_SERVER_ERROR_RATE:-0.08}
      MOCK_PERMANENT_FAILURE_RATE: ${MOCK_PERMANENT_FAILURE_RATE:-0.01}
      MOCK_LOST_RESPONSE_RATE: ${MOCK_LOST_RESPONSE_RATE:-0.03}
      MOCK_LOST_RESPONSE_DELAY: ${MOCK_LOST_RESPONSE_DELAY:-8s}
      MOCK_MAX_PER_SECOND: ${MOCK_MAX_PER_SECOND:-100}
    ports:
      - "127.0.0.1:${MOCK_PROVIDER_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  kafka-data:
