server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Browser code calls /api/...; nginx strips the prefix and forwards to
    # the Go API on the internal Compose network.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # Server-Sent Events must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Prometheus metrics are for operators (scrape the API port directly),
    # not for browsers.
    location = /api/metrics {
        return 404;
    }

    # The versioned API is served by the Go API under the same /api/v1
    # path, so the prefix is forwarded unchanged (no trailing slash).
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # Draft generation and the live dashboard stream Server-Sent Events.
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 64k;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
